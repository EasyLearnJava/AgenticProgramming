# The weather chatbot's checks, on every push, on any branch, that touches projects/Agentic/weather-chatbot: Ruff
# (lint and format), mypy, the unit tests, then the browser tests against the real app in Chromium. Python and every
# package come from uv, exactly as uv.lock pins them.
name: Weather chatbot

on:
  push:
    paths:
      - "projects/Agentic/weather-chatbot/**"
      - ".github/workflows/weather-chatbot.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/Agentic/weather-chatbot
    steps:
      - uses: actions/checkout@v7
      # uv's own action, pinned to a release at least two weeks old, and uv itself, pinned to the version that wrote
      # uv.lock; uv installs the Python in .python-version.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.18"
          enable-cache: true
          cache-dependency-glob: projects/Agentic/weather-chatbot/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e
