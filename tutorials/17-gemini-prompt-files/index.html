<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project 17: Prompts as versioned files</title>
</head>
<body>
  <h1>Project 17: Prompts as versioned files</h1>

  <h2>The versions</h2>
  <p>Each version is its own file in <code>prompts/</code>. The active one is set in <code>prompt_versions.toml</code>.</p>
  <table border="1" cellpadding="4">
    <thead><tr><th>Version</th><th>Fingerprint</th><th>System</th><th>Human</th></tr></thead>
    <tbody id="versions"></tbody>
  </table>

  <h2>Ask</h2>
  <form id="form">
    <label>Your name <input id="name" autocomplete="off"></label>
    <label>Version <select id="version"></select></label>
    <button id="run">Ask Gemini</button>
  </form>
  <p id="status"></p>
  <table border="1" cellpadding="4">
    <thead><tr><th>#</th><th>Answer</th><th>Produced by</th></tr></thead>
    <tbody id="answers"></tbody>
  </table>

  <script>
    // On load: GET /api/prompts fills the versions table and the dropdown, with the active version picked.
    // "Ask Gemini" sends the name and the chosen version to POST /api/hello, and adds the answer to the top of the
    // answers table, with the version and fingerprint that produced it.

    // byId("name") is short for document.getElementById("name").
    function byId(id) {
      return document.getElementById(id);
    }

    function row(...cells) {
      const tr = document.createElement("tr");
      for (const text of cells) {
        const td = document.createElement("td");
        td.style.whiteSpace = "pre-wrap";
        td.textContent = text;
        tr.append(td);
      }
      return tr;
    }

    fetch("/api/prompts")
      .then((res) => {
        if (!res.ok) throw new Error(`the server answered HTTP ${res.status}`);
        return res.json();
      })
      .then(({ active, versions }) => {
        for (const [version, p] of Object.entries(versions)) {
          const shown = version === active ? `${version} (active)` : version;
          byId("versions").append(row(shown, p.fingerprint, p.system, p.human));
          // new Option(text, value, defaultSelected, selected): the active version starts selected.
          byId("version").add(new Option(shown, version, false, version === active));
        }
      })
      .catch((err) => {
        byId("status").textContent = `Something went wrong: ${err.message}`;
      });

    let count = 0;
    byId("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      byId("run").disabled = true;
      byId("status").textContent = "Asking Gemini…";
      try {
        const res = await fetch("/api/hello", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: byId("name").value, version: byId("version").value }),
        });
        if (!res.ok && res.status !== 422 && res.status !== 502) throw new Error(`the server answered HTTP ${res.status}`);
        const data = await res.json();
        if (res.status === 422) {
          byId("status").textContent = data.detail.map((p) => `${p.loc.at(-1)}: ${p.msg}`).join("; ");
        } else if (res.status === 502) {
          byId("status").textContent = `${data.detail} The server's terminal says why.`;
        } else {
          count += 1;
          // Every answer keeps the version and fingerprint that produced it.
          byId("answers").prepend(row(count, data.answer, `${data.prompt} ${data.version} (${data.fingerprint})`));
          byId("status").textContent = "Done.";
        }
      } catch (err) {
        byId("status").textContent = `Something went wrong: ${err.message}`;
      } finally {
        byId("run").disabled = false;
      }
    });
  </script>
</body>
</html>
