[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalscope"
version = "0.1.0"
description = "Evidence-led competitive research with human review"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.67,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rivalscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
