[project]
name = "policylens"
version = "1.0.2"
description = "An approachable, cited policy Q&A app with an inspectable RAG pipeline."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "pydantic>=2.12,<3",
  "langchain-core>=1.2,<2",
  "langchain-text-splitters>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langsmith>=0.14,<1",
  "numpy>=2.2,<3",
  "pypdf>=6,<7",
  "beautifulsoup4>=4.14,<5",
  "httpx>=0.28,<1",
  "tiktoken>=0.9,<1",
  "snowballstemmer>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

