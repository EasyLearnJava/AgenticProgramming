    <rect x="269" y="74" width="194" height="86" rx="10"/><rect x="269" y="241" width="194" height="78" rx="10"/>
    <rect x="529" y="39" width="178" height="56" rx="9"/><rect x="529" y="134" width="178" height="56" rx="9"/>
    <rect x="529" y="218" width="178" height="36" rx="8"/><rect x="529" y="262" width="178" height="36" rx="8"/>
    <rect x="529" y="306" width="178" height="36" rx="8"/>
    <rect x="776" y="121" width="164" height="158" rx="12" fill="#dfede6"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#163d30">
    <g font-size="17" font-weight="600">
      <text x="117" y="95">Travel question</text><text x="117" y="241">Park trip form</text>
      <text x="366" y="104">Travel turn</text><text x="366" y="273">Park checks</text>
      <text x="618" y="64">Kiwi MCP</text><text x="618" y="159">trivago MCP</text>
      <text x="858" y="173">Results</text>
    </g>
    <g font-size="14">
      <text x="117" y="116">Chat tool call</text><text x="117" y="264">Confirmed by visitor</text>
      <text x="366" y="126">Validated arguments</text><text x="366" y="146">Turn budget + deadline</text>
      <text x="366" y="297">Independent sections</text>
      <text x="618" y="84">Party fare</text><text x="618" y="179">Nightly and stay prices</text>
      <text x="618" y="241">Weather lane</text><text x="618" y="285">Park guidance index</text>
      <text x="618" y="329">Current NPS notices</text><text x="858" y="199">Dated quotes,</text>
      <text x="858" y="220">source links and</text><text x="858" y="241">per-check status</text>
    </g>
  </g>
  <path d="M22 368h916" stroke="#c2d2ca"/>
  <g font-family="system-ui,sans-serif" fill="#294e3f">
    <text x="24" y="400" font-size="16" font-weight="600">One failure affects one section</text>
    <text x="24" y="427" font-size="15">A driving plan skips Kiwi. A visit beyond the forecast window still gets current notices and park guidance.</text>
    <text x="24" y="451" font-size="15">The confirmed plan runs without a language model. Standalone travel questions use the chat tools.</text>
  </g>
