<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" role="img" aria-labelledby="t d">
  <title id="t">Travel requests in Nimbus</title>
  <desc id="d">Direct chat calls and confirmed park plans share the same private travel turn and bounded
  provider adapters. A park plan separately retrieves a forecast, park guidance and official notices.
  Each check produces its own sourced result or status.</desc>
