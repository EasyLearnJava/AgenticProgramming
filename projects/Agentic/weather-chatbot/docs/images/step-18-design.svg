    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#477262"/>
    </marker>
  </defs>
  <rect width="960" height="486" rx="18" fill="#f5f8f6"/>
  <g fill="none" stroke="#477262" stroke-width="2" marker-end="url(#a)">
    <path d="M212 99h57"/><path d="M212 237h30V139h27"/><path d="M212 271h57"/>
    <path d="M463 109h31V67h35"/><path d="M463 126h31v36h35"/>
    <path d="M463 267h31v-31h35"/><path d="M463 280h66"/><path d="M463 294h31v30h35"/>
    <path d="M707 67h38v100h31"/><path d="M707 162h69"/>
    <path d="M707 236h69"/><path d="M707 280h36v-33h33"/><path d="M707 324h52v-63h17"/>
  </g>
