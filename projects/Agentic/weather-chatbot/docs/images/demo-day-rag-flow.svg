<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280" role="img"
  aria-labelledby="title desc">
  <title id="title">DemoDay part 2: how Nimbus finds park guidance and answers from it</title>
  <desc id="desc">A swimlane flowchart in four columns: your browser; Nimbus, the FastAPI app on Vercel; Gemini and
    the side paths; and stored data in one Qdrant Cloud park collection. A chat question starts at step 1, where
    Gemini calls resolve_destination; a place Nimbus doesn't cover, such as Glacier (check 12), gets a reply that says
    so and no search. The Retrieval Playground starts at step 2 with the park you pick. Step 2 sets the park or
    trail and a season from the visit date, a season you pick or the question's words: "in spring" gives Spring,
    "Yosemite Fall" and "summer and fall" give none (checks 1, 4 and 5). Step 3 reads the approved passages from
    Qdrant and checks the published version and every passage's hash against the app's catalog. Step 4 ranks the
    question's key words with Qdrant's BM25 index and scoped term rarity (check 3), and step 5 ranks its meaning
    with MiniLM vectors made by Qdrant Cloud inference (check 2). Step 6 fuses both rankings into a shortlist of
    up to 12 passages. Qdrant ColBERT reranks that shortlist using the full question, then Nimbus selects at most
    four passages within 10,000 characters. If ColBERT fails, the original RRF order remains available.
    If the meaning search fails or is slow, BM25 ranks are used alone; if Qdrant or BM25 fails, guidance
    is unavailable. The Playground stops there and shows the season, scores and each passage's decision without
    calling Gemini (checks 1 to 5). Chat continues (checks 6 to 11): Gemini answers from the returned passages or
    says what they don't cover, and only links to returned sources stay clickable. Activity, the LangSmith trace,
    the Sources and Chunks pages and the answer judge show each part.</desc>
