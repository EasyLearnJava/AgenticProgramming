<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1238" viewBox="0 0 960 1238" role="img"
  aria-labelledby="title desc">
  <title id="title">DemoDay part 3: how Nimbus turns a trip request into a checked plan</title>
  <desc id="desc">A swimlane flowchart in four columns: your browser; Nimbus, the FastAPI app on Vercel; rules and
    branches; and outside services. A chat trip request is first checked for scope: the word "trip" passes by rule,
    and an off-task request gets a fixed reply. If this browser turned memory on, Nimbus reads its saved airport,
    units and currency from Mem0. Rules, not a model, read the park, dates, airports, travelers and rooms; a weekend
    is counted in the origin's time zone, so "this week end" on November 10 means Friday the 13th to Sunday the 15th,
    and "from DFW to LAS" gives both airports. Nimbus then runs four checks at the same time: the Open-Meteo
    forecast, stored park guidance in Qdrant, NPS notices and NWS alerts. A park-wide closure or a severe warning
    pauses the plan, and a partial or unverified check asks for review: both show the conditions with no flight or hotel search.
    Otherwise, a flight needs both airports; if one is missing, Nimbus asks only for it, keeping the dates and
    choices (checks 18 and 20). A complete request searches Kiwi flights and Trivago hotels at once within one
    deadline, reusing the conditions already checked (check 19). The Plan a park trip form starts at that search
    and runs its own forecast, guidance and notice checks beside it (check 21). The briefing shows conditions,
    guidance, notices, flights and hotels, and names any provider that failed. Gemini writes none of it. Activity,
    My preferences and Performance show each part.</desc>
