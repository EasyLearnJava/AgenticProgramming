      <rect x="258" y="156" width="278" height="58" rx="12"/>
      <rect x="258" y="234" width="278" height="74" rx="12"/>
      <rect x="258" y="336" width="278" height="58" rx="12"/>
      <rect x="258" y="424" width="278" height="58" rx="12"/>
      <rect x="258" y="520" width="278" height="110" rx="12"/>
      <rect x="258" y="658" width="278" height="58" rx="12"/>
      <rect x="258" y="744" width="278" height="74" rx="12"/>
