<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img"
  aria-labelledby="title desc">
  <title id="title">DemoDay part 1: how Nimbus answers a weather question, or reuses a saved answer</title>
  <desc id="desc">A swimlane flowchart in four columns: your browser; Nimbus, the FastAPI app on Vercel; Gemini and
    Open-Meteo; and stored data in Mem0 and Qdrant Cloud. If this browser turned memory on, Nimbus reads its saved
    preferences from Mem0. It checks the cache rules, then asks Qdrant for an exact match and, if there is none, a
    similar question scoring at least 0.80, among this browser's unexpired answers with the same place, units, timing,
    locale and context. Every prompt starts at step 1 and leaves at the first path it takes. A hit returns the cached answer
    without calling Gemini or the weather tools: prompt 2 by exact match, prompts 3 and 5 by similarity. A miss,
    prompts 1 and 4, goes to the LangGraph agent, where Gemini calls the weather tools on Open-Meteo, whose replies
    Vercel's Runtime Cache keeps. The answer streams to the browser first; then its evidence is checked and, if
    every check passes, it is saved in Qdrant, reusable for two minutes at most, or less if its weather data or the
    day runs out. A failed check is named in Activity. Every step is logged to Axiom for the Activity page and traced
    in LangSmith for the trace view; the Weather cache page lists this browser's entries.</desc>
