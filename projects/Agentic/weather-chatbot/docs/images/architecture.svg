<svg xmlns="http://www.w3.org/2000/svg" width="536" height="270" viewBox="0 0 536 270" role="img" aria-labelledby="title desc"
     font-family="system-ui, sans-serif" fill="#183d35">
  <title id="title">Who handles a Nimbus request</title>
  <desc id="desc">FastAPI receives chat from the browser. Ordinary weather questions use the Gemini and LangGraph tool loop. Trip intake can answer directly or run a park briefing in application code. Both paths can return results in chat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#487469"/>
    </marker>
  </defs>
  <rect x="113" y="10" width="310" height="40" rx="9" fill="#e4f4ed"/>
  <text x="268" y="36" font-size="18" font-weight="650" text-anchor="middle">Browser · Jinja pages and HTMX</text>
  <path d="M268 50v19" stroke="#487469" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="73" width="276" height="42" rx="9" fill="#194f42"/>
  <text x="268" y="100" font-size="18" font-weight="650" fill="#fff" text-anchor="middle">FastAPI · validate and route</text>
  <g fill="none" stroke="#487469" stroke-width="2" marker-end="url(#arrow)">
    <path d="M268 115v15H134v17"/>
    <path d="M268 130h134v17"/>
  </g>
  <g stroke="#80ab9e" fill="#f4faf7">
    <rect x="4" y="151" width="260" height="110" rx="10"/>
    <rect x="272" y="151" width="260" height="110" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="134" y="177" font-size="17" font-weight="650">Weather and tool questions</text>
    <text x="134" y="202" font-size="15">Gemini and LangGraph</text>
    <text x="134" y="225" font-size="15">Call enabled tools and</text>
    <text x="134" y="245" font-size="15">stream results to chat</text>
    <text x="402" y="177" font-size="17" font-weight="650">Trip intake</text>
    <text x="402" y="202" font-size="15">Ask for missing details or</text>
    <text x="402" y="225" font-size="15">check park conditions</text>
    <text x="402" y="245" font-size="15">before a travel search</text>
  </g>
</svg>
