<svg xmlns="http://www.w3.org/2000/svg" width="536" height="305" viewBox="0 0 536 305" role="img" aria-labelledby="title desc"
     font-family="system-ui, sans-serif" fill="#183d35">
  <title id="title">How chat checks a park trip</title>
  <desc id="desc">A dated park request starts four parallel checks: forecast, stored preparation guidance, NPS notices and NWS point alerts. The resulting briefing may pause travel, request review, suggest an adjustment or permit planning. Eligible visitors can confirm a read-only search.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#487469"/>
    </marker>
  </defs>
  <text x="268" y="25" font-size="18" font-weight="650" text-anchor="middle">Visit dates and verified park reference point</text>
  <g fill="#ebf6f1" stroke="#80ab9e">
    <rect x="4" y="43" width="258" height="36" rx="7"/>
    <rect x="274" y="43" width="258" height="36" rx="7"/>
    <rect x="4" y="87" width="258" height="36" rx="7"/>
    <rect x="274" y="87" width="258" height="36" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="16">
    <text x="133" y="67">Reference-point forecast</text>
    <text x="403" y="67">Published NPS guidance</text>
    <text x="133" y="111">Current park notices</text>
    <text x="403" y="111">Active NWS point alerts</text>
  </g>
  <path d="M268 125v20" stroke="#487469" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="72" y="150" width="392" height="42" rx="8" fill="#194f42"/>
  <text x="268" y="177" text-anchor="middle" font-size="17" font-weight="650" fill="#fff">Briefing · scope, date overlap and coverage</text>
  <g fill="none" stroke="#487469" stroke-width="2" marker-end="url(#arrow)">
    <path d="M268 192v14H133v16"/>
    <path d="M268 206h135v16"/>
  </g>
  <rect x="4" y="227" width="258" height="72" rx="8" fill="#fff3df" stroke="#ad8040"/>
  <rect x="274" y="227" width="258" height="72" rx="8" fill="#ebf6f1" stroke="#80ab9e"/>
  <g text-anchor="middle">
    <text x="133" y="252" font-size="17" font-weight="650">Pause</text>
    <text x="133" y="278" font-size="15">Review the alert or change dates</text>
    <text x="403" y="252" font-size="17" font-weight="650">Review, adapt or proceed</text>
    <text x="403" y="278" font-size="15">Confirm an eligible travel search</text>
  </g>
</svg>
