<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1014" width="1160" height="1014" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">How Nimbus is built after step 1</title>
  <desc id="d">Four bands. A, the online request path: you, in a browser, reach Vercel's edge, which gives the request its id and sends it to the FastAPI app, one Vercel Function, which sends back your page; Vercel's CDN serves the stylesheet and icon without the app. B, controlled execution: every request goes through the security headers middleware, then the request context middleware, then FastAPI's router, to the pages, the docs, the health check or the docs' pictures. C, state and data freshness: no database, only a log line kept per request, settings read only by config.py, the docs as Markdown, the static files on the CDN. D, production operations: JSON log lines in Vercel's logs, the tests in CI and the mutation check before each commit, Vercel Functions scaling, and every push to main deploying side by side with CI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1160" height="1014" fill="#ffffff"/>

  <!-- A · The online request path -->
  <rect x="8" y="8" width="1144" height="266" rx="16" fill="#fafafa" stroke="#d7e7e2"/>
  <circle cx="36" cy="38" r="13" fill="#0f766e"/>
  <text x="36" y="43" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="58" y="44" font-size="17" font-weight="700" fill="#053b30" letter-spacing="0.5">ONLINE REQUEST PATH</text>

  <rect x="24" y="62" width="220" height="122" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="40" y="88" font-size="15" font-weight="700" fill="#053b30">You</text>
  <text x="40" y="112" font-size="13" fill="#374151">a browser, on a computer</text>
  <text x="40" y="130" font-size="13" fill="#374151">or a phone · no sign-in</text>
  <text x="40" y="148" font-size="13" fill="#374151">the chat: its card and</text>
  <text x="40" y="166" font-size="13" fill="#374151">welcome, not answering</text>

  <rect x="274" y="62" width="250" height="122" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="290" y="88" font-size="15" font-weight="700" fill="#053b30">Vercel's edge</text>
  <circle cx="500" cy="84" r="13" fill="#0f766e"/>
  <text x="500" y="88" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
  <text x="290" y="112" font-size="13" fill="#374151">HTTPS · routing</text>
  <text x="290" y="130" font-size="13" fill="#374151">x-vercel-id: the request id,</text>
  <text x="290" y="148" font-size="13" fill="#374151">Vercel's own, never a client's</text>
  <text x="290" y="166" font-size="13" fill="#374151">the function runs in iad1</text>

  <rect x="554" y="62" width="300" height="122" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="570" y="88" font-size="15" font-weight="700" fill="#053b30">The FastAPI app</text>
  <text x="570" y="112" font-size="13" fill="#374151">one Vercel Function: /fastapi</text>
  <text x="570" y="130" font-size="13" fill="#374151">Python 3.13 · packages from uv.lock</text>
  <text x="570" y="148" font-size="13" fill="#374151">main.py → create_app()</text>
  <text x="570" y="166" font-size="13" fill="#374151">band B follows a request in it</text>

  <rect x="884" y="62" width="252" height="122" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="900" y="88" font-size="15" font-weight="700" fill="#053b30">Your page</text>
  <text x="900" y="112" font-size="13" fill="#374151">HTML from a Jinja2 template,</text>
  <text x="900" y="130" font-size="13" fill="#374151">or JSON from the health check</text>
  <text x="900" y="148" font-size="13" fill="#374151">the security headers</text>
  <text x="900" y="166" font-size="13" fill="#374151">x-request-id: the request id</text>

  <line x1="244" y1="123" x2="272" y2="123" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="524" y1="123" x2="552" y2="123" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="854" y1="123" x2="882" y2="123" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="399" y1="184" x2="399" y2="202" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="274" y="204" width="330" height="58" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="290" y="226" font-size="15" font-weight="700" fill="#053b30">Vercel's CDN</text>
  <text x="290" y="248" font-size="13" fill="#374151">app.css and favicon.svg, without the app</text>

  <!-- B · Controlled execution -->
  <rect x="8" y="288" width="1144" height="330" rx="16" fill="#fafafa" stroke="#d7e7e2"/>
  <circle cx="36" cy="318" r="13" fill="#0f766e"/>
  <text x="36" y="323" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="58" y="324" font-size="17" font-weight="700" fill="#053b30" letter-spacing="0.5">CONTROLLED EXECUTION</text>

  <line x1="704" y1="184" x2="704" y2="340" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="370" font-size="13" fill="#374151">Every request takes one path: the two</text>
  <text x="40" y="388" font-size="13" fill="#374151">middleware, outermost first, then</text>
  <text x="40" y="406" font-size="13" fill="#374151">FastAPI's router. Nothing runs on a</text>
  <text x="40" y="424" font-size="13" fill="#374151">visitor's behalf yet: no input to</text>
  <text x="40" y="442" font-size="13" fill="#374151">check, no model, no tool.</text>

  <rect x="554" y="342" width="300" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="570" y="368" font-size="15" font-weight="700" fill="#053b30">Security headers</text>
  <text x="570" y="392" font-size="13" fill="#374151">SecurityHeadersMiddleware, outermost</text>
  <text x="570" y="410" font-size="13" fill="#374151">CSP enforced: only our own files</text>
  <text x="570" y="428" font-size="13" fill="#374151">nosniff · no framing · referrer</text>

  <rect x="884" y="342" width="252" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="900" y="368" font-size="15" font-weight="700" fill="#053b30">Request context</text>
  <text x="900" y="392" font-size="13" fill="#374151">the id on every log line</text>
  <text x="900" y="410" font-size="13" fill="#374151">one line per request: path,</text>
  <text x="900" y="428" font-size="13" fill="#374151">status, ms · never the query</text>

  <line x1="854" y1="394" x2="882" y2="394" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1010" y1="446" x2="1010" y2="474" stroke="#0f766e" stroke-width="2"/>
  <line x1="159" y1="474" x2="1010" y2="474" stroke="#0f766e" stroke-width="2"/>
  <text x="560" y="466" font-size="12" font-style="italic" fill="#4b5563" text-anchor="middle">FastAPI's router</text>
  <line x1="159" y1="474" x2="159" y2="496" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="474" x2="445" y2="496" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="731" y1="474" x2="731" y2="496" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1009" y1="474" x2="1009" y2="496" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="498" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="40" y="524" font-size="15" font-weight="700" fill="#053b30">Pages</text>
  <text x="40" y="548" font-size="13" fill="#374151">pages.py · Jinja2 templates</text>
  <text x="40" y="566" font-size="13" fill="#374151">the chat's card, the lists,</text>
  <text x="40" y="584" font-size="13" fill="#374151">the 404 page · Jinja2 escaping on</text>

  <rect x="310" y="498" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="326" y="524" font-size="15" font-weight="700" fill="#053b30">Docs</text>
  <circle cx="556" cy="520" r="11" fill="#7c3aed"/>
  <text x="556" y="525" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <text x="326" y="548" font-size="13" fill="#374151">docs.py · Markdown, raw HTML off</text>
  <text x="326" y="566" font-size="13" fill="#374151">found by address in a registry,</text>
  <text x="326" y="584" font-size="13" fill="#374151">never by a path from the URL</text>

  <rect x="596" y="498" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="612" y="524" font-size="15" font-weight="700" fill="#053b30">Health check</text>
  <text x="612" y="548" font-size="13" fill="#374151">health.py · GET and HEAD</text>
  <text x="612" y="566" font-size="13" fill="#374151">/api/health: the build, the time</text>
  <text x="612" y="584" font-size="13" fill="#374151">never cached (no-store)</text>

  <rect x="882" y="498" width="254" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="898" y="524" font-size="15" font-weight="700" fill="#053b30">Docs' pictures</text>
  <text x="898" y="548" font-size="13" fill="#374151">docs/images/, served by</text>
  <text x="898" y="566" font-size="13" fill="#374151">the app, with an id and</text>
  <text x="898" y="584" font-size="13" fill="#374151">the security headers</text>

  <!-- C · State and data freshness -->
  <rect x="8" y="632" width="1144" height="150" rx="16" fill="#fafafa" stroke="#d7e7e2"/>
  <circle cx="36" cy="662" r="13" fill="#0f766e"/>
  <text x="36" y="667" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="58" y="668" font-size="17" font-weight="700" fill="#053b30" letter-spacing="0.5">STATE AND DATA FRESHNESS</text>

  <rect x="24" y="684" width="270" height="84" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="40" y="710" font-size="15" font-weight="700" fill="#053b30">No database</text>
  <text x="40" y="734" font-size="13" fill="#374151">only a log line per request is kept</text>
  <text x="40" y="752" font-size="13" fill="#374151">no sessions, no cookies</text>

  <rect x="310" y="684" width="270" height="84" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="326" y="710" font-size="15" font-weight="700" fill="#053b30">Settings and secrets</text>
  <text x="326" y="734" font-size="13" fill="#374151">Vercel's environment variables</text>
  <text x="326" y="752" font-size="13" fill="#374151">read only by config.py, at start</text>

  <rect x="596" y="684" width="270" height="84" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="612" y="710" font-size="15" font-weight="700" fill="#053b30">Docs as Markdown</text>
  <text x="612" y="734" font-size="13" fill="#374151">docs/*.md, in the function</text>
  <text x="612" y="752" font-size="13" fill="#374151">read once by each copy</text>

  <rect x="882" y="684" width="254" height="84" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="898" y="710" font-size="15" font-weight="700" fill="#053b30">Static files</text>
  <text x="898" y="734" font-size="13" fill="#374151">public/static/ on Vercel's</text>
  <text x="898" y="752" font-size="13" fill="#374151">CDN, never in the function</text>

  <!-- D · 09 · Production operations -->
  <rect x="8" y="796" width="1144" height="170" rx="16" fill="#fafafa" stroke="#d7e7e2"/>
  <circle cx="36" cy="826" r="13" fill="#0f766e"/>
  <text x="36" y="831" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="58" y="832" font-size="17" font-weight="700" fill="#053b30" letter-spacing="0.5">09 · PRODUCTION OPERATIONS</text>

  <rect x="24" y="848" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="40" y="874" font-size="15" font-weight="700" fill="#053b30">Observability</text>
  <text x="40" y="898" font-size="13" fill="#374151">a JSON line per request → Vercel's</text>
  <text x="40" y="916" font-size="13" fill="#374151">logs: its id, commit, deployment</text>

  <rect x="310" y="848" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="326" y="874" font-size="15" font-weight="700" fill="#053b30">Evaluation</text>
  <text x="326" y="898" font-size="13" fill="#374151">Ruff · mypy · unit, browser and</text>
  <text x="326" y="916" font-size="13" fill="#374151">a11y tests, in CI · a mutation</text>
  <text x="326" y="934" font-size="13" fill="#374151">check before each commit</text>

  <rect x="596" y="848" width="270" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="612" y="874" font-size="15" font-weight="700" fill="#053b30">Reliability and scale</text>
  <text x="612" y="898" font-size="13" fill="#374151">Vercel Functions scale on demand</text>
  <text x="612" y="916" font-size="13" fill="#374151">300 s a request, Vercel's default</text>

  <rect x="882" y="848" width="254" height="104" rx="10" fill="#fcfcfc" stroke="#0f766e"/>
  <text x="898" y="874" font-size="15" font-weight="700" fill="#053b30">Release and recovery</text>
  <text x="898" y="898" font-size="13" fill="#374151">every push to main deploys,</text>
  <text x="898" y="916" font-size="13" fill="#374151">beside CI · a tag a step</text>
  <text x="898" y="934" font-size="13" fill="#374151">roll back in Vercel</text>

  <!-- Legend -->
  <line x1="24" y1="990" x2="70" y2="990" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="995" font-size="13" fill="#374151">Request and response</text>
  <text x="1136" y="995" font-size="13" fill="#374151" text-anchor="end">02, 09: the reference's parts · +: only in Nimbus</text>
</svg>
