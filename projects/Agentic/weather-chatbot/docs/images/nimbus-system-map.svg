<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1770" viewBox="0 0 1440 1770" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#153e35">
  <title id="title">Nimbus: from question to evidence</title>
  <desc id="desc">A browser sends bounded conversation history to FastAPI on Vercel. Requests use either Gemini with a LangGraph tool loop or deterministic trip intake and park briefings. Shared adapters retrieve weather, versioned NPS guidance, official notices and optional travel offers. Park retrieval uses native BM25 and hosted MiniLM in one Qdrant collection. A dense-only failure can retain BM25; a full provider outage makes guidance unavailable. NWS alerts belong to park briefings. HTML and server-sent events return answers and source evidence to the browser. Optional observability stores operational metadata. Category-only feedback informs human-written synthetic park-intake regressions. Replay and repeated live trials produce scorecards, and an exact-build evidence gate supports a human release decision.</desc>
