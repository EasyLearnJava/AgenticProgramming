# Nimbus, the weather chatbot, in Python: its dependencies, pinned to exact versions, and its tools' settings.
# uv reads this file (uv sync, uv run ...), and so does Vercel, which installs the dependencies with uv from uv.lock.
[project]
name = "nimbus"
version = "0.1.0"
description = "Nimbus, a weather chatbot: FastAPI, LangGraph and Jinja2, built step by step"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.2",
    "httpx2==2.13.1",
    "jinja2==3.1.6",
    "langchain-core==1.6.12",
    "langchain-google-genai==4.4.2",
    "langgraph==1.2.16",
    "markdown-it-py==4.2.0",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pydantic-settings==2.16.0",
    "sentry-sdk==2.72.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "tzdata==2026.5",
    "vercel==0.12.0",
]

# Only on your computer and in CI: the checks, the tests, and the server to run the app with.
[dependency-groups]
# Optional local CPU inference and offline indexing. Vercel installs only production dependencies.
ml = [
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "truststore==0.10.5",
    "transformers==5.20.1",
    "filelock==4.2.1",
    "setuptools==84.1.0",
]
dev = [
    "axe-playwright-python==0.1.8",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
    "ruff==0.17.1",
    "uvicorn==0.54.0",
]

# Versions released at least two weeks before this step: a newer one waits until it has had time to settle. certifi's
# cutoff is two weeks before 2 November, for its release that drops emSign's root CAs, under which keys were
# compromised (issue 94).
[tool.uv]
exclude-newer = "2026-10-17T00:00:00Z"
# Narrow security-fix exceptions: exact patched versions remain pinned above.
[tool.uv.exclude-newer-package]
certifi = "2026-10-19T00:00:00Z"
filelock = "2026-10-18T00:00:00Z"
setuptools = "2026-10-20T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "RET", "PTH", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and literal numbers that say what they check.
"tests/**" = ["S101"]
# Our sentences: some speak of a token, which S105 takes for a hardcoded one; none holds a secret.
"nimbus/errors.py" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["main.py", "nimbus", "tests", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["axe_playwright_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The unit tests by default; the browser tests with `uv run pytest tests/e2e`.
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# A warning fails the test that caused it, so a deprecation is fixed when it appears (issue 1).
filterwarnings = ["error"]

# CPU wheels avoid downloading CUDA runtimes on Windows and Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The adapter is typed and tested here; avoid traversing the third-party ML implementation during app checks.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "huggingface_hub", "huggingface_hub.*"]
follow_imports = "skip"
ignore_missing_imports = true
