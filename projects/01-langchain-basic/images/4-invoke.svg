.ehead { font-size: 14px; font-weight: 700; fill: #cf222e; }
.etext { font-size: 13px; fill: #a40e26; }
.term { font-size: 13.5px; fill: #9198a1; }
.term-ok { fill: #7ee787; }
.term-bad { fill: #ff7b72; }
.take { font-size: 16px; }
.take-head { font-weight: 700; fill: #7d4e00; }
.num { font-size: 18px; font-weight: 700; fill: #ffffff; }
.alabel { font-size: 13px; fill: #59636e; }
.alabel-step { font-size: 14px; font-weight: 700; fill: #6639ba; }
.chip { font-size: 12.5px; fill: #6639ba; }
.tag { font-size: 12px; fill: #59636e; }
.blank { fill: #8250df; font-weight: 700; }
.card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.box-step { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
.box-idle { fill: #ffffff; stroke: #8250df; stroke-width: 2; stroke-dasharray: 7 5; }
.box-chain { fill: #fdfaff; stroke: #8250df; stroke-width: 2; }
.box-code { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
.box-val { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
.box-err { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
.frame-ok { fill: #ffffff; stroke: #4ac26b; stroke-width: 2; }
.frame-bad { fill: #ffffff; stroke: #ff8182; stroke-width: 2; }
.box-term { fill: #1f2328; }
.box-take { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
.box-chip { fill: #ffffff; stroke: #c297ff; stroke-width: 1.2; }
.box-tag { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
.rule { stroke: #d0d7de; stroke-width: 1.5; }
.flow { stroke: #8c959f; stroke-width: 2; fill: none; }
.flow-bad { stroke: #cf222e; stroke-width: 2; fill: none; }
.num-bg { fill: #8250df; }
]]></style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
  </marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
  </marker>
</defs>
<rect x="0.75" y="0.75" width="958.5" height="646.5" rx="14" class="card"/>
<circle cx="49" cy="50" r="17" class="num-bg"/>
<text x="49" y="56.5" class="num" text-anchor="middle">4</text>
<text x="78" y="59" class="title">Running it</text>
<text x="32" y="92" class="sub">chain.invoke({}) runs both steps in order. It returns a Promise: await waits for the answer.</text>
<text x="32" y="130" class="lane">WHAT GOES THROUGH THE CHAIN</text>
<rect x="122" y="144" width="240" height="56" rx="10" class="box-val"/>
<text x="242" y="168" class="val val-big" text-anchor="middle">{}</text>
<text x="242" y="190" class="note" text-anchor="middle">the input: an empty object</text>
<path d="M242,204 L242,230" class="flow" marker-end="url(#arrow)"/>
<rect x="72" y="234" width="340" height="220" rx="10" class="box-chain"/>
<text x="90" y="262" class="name">chain</text>
<text x="394" y="262" class="kind" text-anchor="end">RunnableSequence</text>
<rect x="112" y="278" width="260" height="48" rx="10" class="box-step"/>
<text x="128" y="308" class="name">prompt</text>
<text x="356" y="308" class="kind" text-anchor="end">PromptTemplate</text>
<rect x="112" y="388" width="260" height="48" rx="10" class="box-step"/>
<text x="128" y="418" class="name">toText</text>
<text x="356" y="418" class="kind" text-anchor="end">RunnableLambda</text>
<path d="M242,330 L242,384" class="flow" marker-end="url(#arrow)"/>
<rect x="165.7" y="343" width="152.6" height="26" rx="13" class="box-val"/>
<text x="242" y="360.5" class="vhead" text-anchor="middle">StringPromptValue</text>
<path d="M242,458 L242,484" class="flow" marker-end="url(#arrow)"/>
<rect x="72" y="488" width="340" height="60" rx="10" class="box-val"/>
<text x="242" y="511" class="vhead" text-anchor="middle">a string</text>
<text x="242" y="535" class="val" text-anchor="middle">"Hello World, welcome to LangChain!"</text>
<text x="482" y="130" class="lane">WITH AND WITHOUT AWAIT</text>
<rect x="482" y="144" width="446" height="192" rx="10" class="frame-ok"/>
<text x="498" y="172" class="vhead">With await, as in hello.js</text>
<text x="498" y="200" class="code">const answer = await chain.invoke({});</text>
<text x="498" y="222" class="code">console.log(answer);</text>
<text x="498" y="248" class="note">await waits for the chain, then gives back the string</text>
<rect x="498" y="266" width="414" height="52" rx="8" class="box-term"/>
<text x="514" y="297" class="term term-ok">Hello World, welcome to LangChain!</text>
<rect x="482" y="356" width="446" height="192" rx="10" class="frame-bad"/>
<text x="498" y="384" class="ehead">Without await, as in Things to try 4</text>
<text x="498" y="412" class="code">const answer = chain.invoke({});</text>
<text x="498" y="434" class="code">console.log(answer);</text>
<text x="498" y="460" class="note">console.log runs before the chain has finished</text>
<rect x="498" y="478" width="414" height="52" rx="8" class="box-term"/>
<text x="514" y="509" class="term term-bad">Promise { &lt;pending&gt; }</text>
<rect x="32" y="572" width="896" height="52" rx="10" class="box-take"/>
<text x="50" y="604" class="take"><tspan class="take-head">Takeaway</tspan><tspan dx="12">In LangChain.js, invoke() returns a Promise: await it to get the answer.</tspan></text>
</svg>
