<svg xmlns="http://www.w3.org/2000/svg" width="960" height="648" viewBox="0 0 960 648" role="img" aria-labelledby="title desc">
<!-- The diagram for README.md's section "④ Running it". Plain SVG: edit the text in place. -->
<title id="title">④ Running it</title>
<desc id="desc">The input {}, an empty object, goes into chain, a RunnableSequence: prompt (a PromptTemplate) gives back a StringPromptValue, which goes into toText (a RunnableLambda), which gives back the string "Hello World, welcome to LangChain!". With await, as in hello.js: const answer = await chain.invoke({}); console.log(answer); prints Hello World, welcome to LangChain!. Without await: const answer = chain.invoke({}); console.log(answer); prints Promise { &lt;pending&gt; }, because console.log runs before the chain has finished.</desc>
<style><![CDATA[
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.code, .code-muted, .kind, .val, .etext, .term, .alabel, .chip, .fname { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.title { font-size: 26px; font-weight: 700; }
.sub { font-size: 16px; fill: #59636e; }
.lane { font-size: 12.5px; font-weight: 700; fill: #59636e; letter-spacing: 1px; }
.name { font-size: 17px; font-weight: 700; }
.kind { font-size: 13.5px; fill: #6639ba; }
.code { font-size: 13.5px; }
.code-muted { font-size: 13px; fill: #59636e; }
.fname { font-size: 15px; font-weight: 700; }
.note { font-size: 13.5px; fill: #59636e; }
.pill { font-size: 14px; font-weight: 600; fill: #6639ba; }
.val { font-size: 13px; fill: #116329; }
.val-big { font-size: 16px; font-weight: 700; }
