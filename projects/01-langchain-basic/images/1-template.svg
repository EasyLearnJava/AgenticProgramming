<svg xmlns="http://www.w3.org/2000/svg" width="960" height="554" viewBox="0 0 960 554" role="img" aria-labelledby="title desc">
<!-- The diagram for README.md's section "① The template". Plain SVG: edit the text in place. -->
<title id="title">① The template</title>
<desc id="desc">Two prompts. This project's: PromptTemplate with the text "Hello World, welcome to LangChain!" and inputVariables [], which invoke({}) turns into a StringPromptValue holding that text. One with a variable: "Hello {name}, welcome to LangChain!", inputVariables [ 'name' ]. invoke({ name: "Ada" }) gives a StringPromptValue holding 'Hello Ada, welcome to LangChain!'; invoke({}) throws Error: (f-string) Missing value for input name.</desc>
<style><![CDATA[
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.code, .code-muted, .kind, .val, .etext, .term, .alabel, .chip, .fname { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.title { font-size: 26px; font-weight: 700; }
.sub { font-size: 16px; fill: #59636e; }
.lane { font-size: 12.5px; font-weight: 700; fill: #59636e; letter-spacing: 1px; }
.name { font-size: 17px; font-weight: 700; }
.kind { font-size: 13.5px; fill: #6639ba; }
.code { font-size: 13.5px; }
.code-muted { font-size: 13px; fill: #59636e; }
.fname { font-size: 15px; font-weight: 700; }
.note { font-size: 13.5px; fill: #59636e; }
.pill { font-size: 14px; font-weight: 600; fill: #6639ba; }
.val { font-size: 13px; fill: #116329; }
.val-big { font-size: 16px; font-weight: 700; }
.vhead { font-size: 14px; font-weight: 700; fill: #1a7f37; }
.ehead { font-size: 14px; font-weight: 700; fill: #cf222e; }
.etext { font-size: 13px; fill: #a40e26; }
.term { font-size: 13.5px; fill: #9198a1; }
.term-ok { fill: #7ee787; }
.term-bad { fill: #ff7b72; }
.take { font-size: 16px; }
.take-head { font-weight: 700; fill: #7d4e00; }
.num { font-size: 18px; font-weight: 700; fill: #ffffff; }
.alabel { font-size: 13px; fill: #59636e; }
.alabel-step { font-size: 14px; font-weight: 700; fill: #6639ba; }
.chip { font-size: 12.5px; fill: #6639ba; }
.tag { font-size: 12px; fill: #59636e; }
.blank { fill: #8250df; font-weight: 700; }
.card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.box-step { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
.box-idle { fill: #ffffff; stroke: #8250df; stroke-width: 2; stroke-dasharray: 7 5; }
.box-chain { fill: #fdfaff; stroke: #8250df; stroke-width: 2; }
.box-code { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
.box-val { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
.box-err { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
.frame-ok { fill: #ffffff; stroke: #4ac26b; stroke-width: 2; }
.frame-bad { fill: #ffffff; stroke: #ff8182; stroke-width: 2; }
.box-term { fill: #1f2328; }
.box-take { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
.box-chip { fill: #ffffff; stroke: #c297ff; stroke-width: 1.2; }
.box-tag { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
.rule { stroke: #d0d7de; stroke-width: 1.5; }
.flow { stroke: #8c959f; stroke-width: 2; fill: none; }
.flow-bad { stroke: #cf222e; stroke-width: 2; fill: none; }
.num-bg { fill: #8250df; }
]]></style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
  </marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
  </marker>
</defs>
<rect x="0.75" y="0.75" width="958.5" height="552.5" rx="14" class="card"/>
<circle cx="49" cy="50" r="17" class="num-bg"/>
<text x="49" y="56.5" class="num" text-anchor="middle">1</text>
<text x="78" y="59" class="title">The template</text>
<text x="32" y="92" class="sub">Two templates: this project's, with no variables, and one with a {name} to fill in.</text>
<text x="32" y="130" class="lane">THIS PROJECT: NO VARIABLES</text>
<rect x="32" y="142" width="340" height="100" rx="10" class="box-step"/>
<text x="48" y="172" class="name">prompt</text>
<text x="356" y="172" class="kind" text-anchor="end">PromptTemplate</text>
<text x="48" y="202" class="code" xml:space="preserve">"Hello World, welcome to LangChain!"</text>
<text x="48" y="228" class="code-muted">inputVariables: []</text>
<path d="M376,192 L588,192" class="flow" marker-end="url(#arrow)"/>
<text x="482" y="182" class="alabel" text-anchor="middle">invoke({})</text>
<rect x="592" y="160" width="336" height="64" rx="10" class="box-val"/>
<text x="608" y="185" class="vhead">StringPromptValue</text>
<text x="608" y="208" class="val">'Hello World, welcome to LangChain!'</text>
<text x="32" y="284" class="lane">WITH A VARIABLE, AS IN THINGS TO TRY 2</text>
<rect x="32" y="296" width="340" height="100" rx="10" class="box-step"/>
<text x="48" y="326" class="name">prompt</text>
<text x="356" y="326" class="kind" text-anchor="end">PromptTemplate</text>
<text x="48" y="356" class="code" xml:space="preserve">"Hello <tspan class="blank">{name}</tspan>, welcome to LangChain!"</text>
<text x="48" y="382" class="code-muted">inputVariables: [ 'name' ]</text>
<path d="M392,346 L392,412 L588,412" class="flow-bad" marker-end="url(#arrow-bad)"/>
<path d="M376,346 L392,346 L392,324 L588,324" class="flow" marker-end="url(#arrow)"/>
<text x="492" y="314" class="alabel" text-anchor="middle">invoke({ name: "Ada" })</text>
<rect x="592" y="292" width="336" height="64" rx="10" class="box-val"/>
<text x="608" y="317" class="vhead">StringPromptValue</text>
<text x="608" y="340" class="val">'Hello Ada, welcome to LangChain!'</text>
<text x="492" y="402" class="alabel" text-anchor="middle">invoke({})</text>
<rect x="592" y="372" width="336" height="82" rx="10" class="box-err"/>
<text x="608" y="397" class="ehead">Error</text>
<text x="608" y="420" class="etext">(f-string) Missing value</text>
<text x="608" y="439" class="etext">for input name</text>
<rect x="32" y="478" width="896" height="52" rx="10" class="box-take"/>
<text x="50" y="510" class="take"><tspan class="take-head">Takeaway</tspan><tspan dx="12">invoke() fills in the {variables} and gives back a StringPromptValue, not a string.</tspan></text>
</svg>
