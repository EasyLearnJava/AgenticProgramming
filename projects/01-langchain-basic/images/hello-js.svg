<svg xmlns="http://www.w3.org/2000/svg" width="960" height="948" viewBox="0 0 960 948" role="img" aria-labelledby="title desc">
<!-- The picture for README.md's section "hello.js, from top to bottom". Plain SVG: edit the text in place. -->
<title id="title">hello.js, from top to bottom</title>
<desc id="desc">hello.js without its comments, in the order Node runs it, from top to bottom: the two import lines share the first box, then one statement per box. The two import lines take PromptTemplate and RunnableLambda from the package @langchain/core. 1: const prompt = PromptTemplate.fromTemplate("Hello World, welcome to LangChain!"); makes prompt, a PromptTemplate that holds the text; not run yet. 2: const toText = RunnableLambda.from((value) =&gt; value.toString()); makes toText, a RunnableLambda that holds the function; not run yet. 3: const chain = prompt.pipe(toText); makes chain, a RunnableSequence: prompt, then toText; not run yet. 4: const answer = await chain.invoke({}); runs the chain: the input {} goes into prompt, which gives back a StringPromptValue, which goes into toText, which gives back the string. await waits for the chain to finish, then answer holds "Hello World, welcome to LangChain!". Last: console.log(answer); prints Hello World, welcome to LangChain! in the terminal. Takeaway: making the steps runs nothing; invoke() is the line that runs them.</desc>
