<text x="48" y="334" class="term" xml:space="preserve">found 0 vulnerabilities</text>
<text x="48" y="354" class="term" xml:space="preserve">$ <tspan class="term-cmd">npm start</tspan></text>
<text x="48" y="394" class="term" xml:space="preserve">&gt; start</text>
<text x="48" y="414" class="term" xml:space="preserve">&gt; node hello.js</text>
