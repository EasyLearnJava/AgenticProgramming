<svg xmlns="http://www.w3.org/2000/svg" width="960" height="592" viewBox="0 0 960 592" role="img" aria-labelledby="title desc">
<!-- The picture for README.md's section "Run it". Plain SVG: edit the text in place. -->
<title id="title">Run it</title>
<desc id="desc">A terminal. Typed: cd projects/01-langchain-basic, then npm install, which prints: added 12 packages, and audited 13 packages in 5s; 3 packages are looking for funding; run npm fund for details; found 0 vulnerabilities. Then npm start, which prints: &gt; start, &gt; node hello.js, and Hello World, welcome to LangChain!, then a new $ line: the terminal is ready for the next command. The notes: cd goes into the project's folder. npm install, once, downloads @langchain/core and the packages it needs into node_modules/. Its report is information only, with nothing to do. npm start, each time, runs the program: the start script in package.json, node hello.js. npm shows the script it runs. hello.js prints the answer, with console.log(answer). Then the program ends. Takeaway: npm install once, to download @langchain/core; npm start each time, to run hello.js.</desc>
