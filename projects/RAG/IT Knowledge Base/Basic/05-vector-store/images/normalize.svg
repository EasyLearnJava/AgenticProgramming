<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title desc">
<title id="title">What Qdrant stores with cosine: the same direction, length 1</title>
<desc id="desc">A grid from 0 to 5 with a dashed circle of radius 1. A long arrow goes to [3, 4], length 5: what Gemini returns. A short arrow along the same line ends on the circle at [0.6, 0.8], length 1: what Qdrant stores. Every number is divided by 5. The direction, and so the cosine score, doesn't change.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.title { font-size: 24px; font-weight: 700; }
.sub { font-size: 15px; fill: #59636e; }
.head { font-size: 15px; font-weight: 700; }
.body { font-size: 14px; }
.note { font-size: 13px; fill: #59636e; }
.math { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.5px; }
.axis { font-size: 11px; fill: #6e7781; }
.lab { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; }
.lab-a { fill: #0969da; } .lab-b { fill: #8250df; } .lab-c { fill: #bc4c00; }
.measure { font-size: 13px; font-weight: 700; }
.take { font-size: 15px; }
.take-head { font-weight: 700; fill: #7d4e00; }
.card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.plot { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
.grid { stroke: #eaeef2; stroke-width: 1; }
.axisline { stroke: #8c959f; stroke-width: 1.5; }
.box-take { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
.panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="563.5" rx="14" class="card"/>
<text x="32" y="52" class="title" xml:space="preserve">What Qdrant stores with cosine: the same direction, length 1</text>
<text x="32" y="80" class="sub" xml:space="preserve">Gemini returns [3, 4]; a cosine collection stores [0.6, 0.8]</text>
<rect x="66" y="108" width="335" height="335" rx="0" class="plot"/>
<line x1="133" y1="108" x2="133" y2="443" class="grid"/>
<line x1="66" y1="376" x2="401" y2="376" class="grid"/>
<line x1="200" y1="108" x2="200" y2="443" class="grid"/>
<line x1="66" y1="309" x2="401" y2="309" class="grid"/>
<line x1="267" y1="108" x2="267" y2="443" class="grid"/>
<line x1="66" y1="242" x2="401" y2="242" class="grid"/>
<line x1="334" y1="108" x2="334" y2="443" class="grid"/>
<line x1="66" y1="175" x2="401" y2="175" class="grid"/>
<line x1="401" y1="108" x2="401" y2="443" class="grid"/>
<line x1="66" y1="108" x2="401" y2="108" class="grid"/>
<line x1="66" y1="443" x2="401" y2="443" class="axisline"/>
<line x1="66" y1="443" x2="66" y2="108" class="axisline"/>
<text x="66" y="459" class="axis" text-anchor="middle" xml:space="preserve">0</text>
<text x="133" y="459" class="axis" text-anchor="middle" xml:space="preserve">1</text>
<text x="58" y="380" class="axis" text-anchor="end" xml:space="preserve">1</text>
<text x="200" y="459" class="axis" text-anchor="middle" xml:space="preserve">2</text>
<text x="58" y="313" class="axis" text-anchor="end" xml:space="preserve">2</text>
<text x="267" y="459" class="axis" text-anchor="middle" xml:space="preserve">3</text>
<text x="58" y="246" class="axis" text-anchor="end" xml:space="preserve">3</text>
<text x="334" y="459" class="axis" text-anchor="middle" xml:space="preserve">4</text>
<text x="58" y="179" class="axis" text-anchor="end" xml:space="preserve">4</text>
<text x="401" y="459" class="axis" text-anchor="middle" xml:space="preserve">5</text>
<text x="58" y="112" class="axis" text-anchor="end" xml:space="preserve">5</text>
<path d="M133,443 A67,67 0 0 0 66,376" style="fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4"/>
<line x1="66" y1="443" x2="267" y2="175" style="stroke:#9198a1;stroke-width:3" marker-end="url(#mgrey)"/>
<defs><marker id="mgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<line x1="66" y1="443" x2="106.2" y2="389.4" style="stroke:#0969da;stroke-width:4" marker-end="url(#ma)"/>
<text x="255" y="177" class="lab" style="fill:#59636e" text-anchor="end" xml:space="preserve">[3, 4]  length 5</text>
<text x="120.2" y="399.4" class="lab lab-a" xml:space="preserve">[0.6, 0.8]  length 1</text>
<rect x="480" y="108" width="448" height="338" rx="10" class="panel"/>
<text x="498" y="138" class="head" xml:space="preserve">Gemini returns</text>
<text x="498" y="160" class="math" xml:space="preserve">[3, 4]: length √(3² + 4²) = 5</text>
<text x="498" y="194" class="head" xml:space="preserve">Qdrant stores</text>
<text x="498" y="216" class="math" xml:space="preserve">[3/5, 4/5] = [0.6, 0.8]: length 1</text>
<text x="498" y="236" class="note" xml:space="preserve">Every number divided by the length.</text>
<text x="498" y="270" class="head" xml:space="preserve">Why it changes nothing</text>
<text x="498" y="292" class="body" xml:space="preserve">Cosine only looks at the direction, and the</text>
<text x="498" y="312" class="body" xml:space="preserve">direction is the same: same meaning, same</text>
<text x="498" y="332" class="body" xml:space="preserve">scores. Qdrant does it so that each search is</text>
<text x="498" y="352" class="body" xml:space="preserve">a simpler sum, and faster.</text>
<text x="498" y="386" class="head" xml:space="preserve">Only with cosine</text>
<text x="498" y="408" class="body" xml:space="preserve">Dot, Euclid and Manhattan store the vectors</text>
<text x="498" y="428" class="body" xml:space="preserve">exactly as Gemini returned them.</text>
<rect x="32" y="487" width="896" height="46" rx="10" class="box-take"/>
<text x="50" y="516" class="take" xml:space="preserve"><tspan class="take-head">Normalized:</tspan> same direction, length 1. The meaning, and every cosine score, stay the same.</text>
</svg>