# Qdrant, the vector database, as a server in Docker, so the stored chunks outlive each run of the app.
#
#   docker compose up -d      start it in the background (the first time, Docker downloads the image)
#   docker compose down       stop it; the data stays in the qdrant_storage volume (down -v deletes that too)
#
# Then the app finds it at http://localhost:6333, and its dashboard is at http://localhost:6333/dashboard.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1        # pinned: the server version that matches qdrant-client 1.19.1
    ports:
      - "6333:6333"                     # Qdrant's REST API and dashboard, on this machine's port 6333
    volumes:
      - qdrant_storage:/qdrant/storage  # where Qdrant keeps its data, in a Docker volume that outlives the container

volumes:
  qdrant_storage:
