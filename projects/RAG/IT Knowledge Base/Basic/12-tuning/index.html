<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IT Knowledge Base</title>
</head>
<body>
  <!--
    IT Knowledge Base: Chat Page. Served by main.py at /; calls GET /api/stats and POST /api/query.
  -->
  <h1>IT Knowledge Base</h1>
  <p id="stats">Loading…</p>
  <form id="form">
    <label>Your question
      <input id="question" size="60" maxlength="500" autocomplete="off" value="How do I fix VPN connection timeouts?">
    </label>
    <button id="ask">Ask</button>
  </form>
  <p id="status">Gemini is asked to answer from the articles the search finds in the knowledge base.</p>
  <div id="answers"></div>

  <script>
    const statsLine = document.getElementById("stats");
    const status = document.getElementById("status");
    const button = document.getElementById("ask");
    const answers = document.getElementById("answers");

    // On load: one line about what the server holds.
    fetch("/api/stats")
      .then((res) => {
        if (!res.ok) throw new Error(`the server answered HTTP ${res.status}`);
        return res.json();
      })
      .then((s) => {
        statsLine.textContent = `${s.documents} articles in ${s.chunks} chunks. Answers by ${s.chat_model}, `
          + `search by ${s.embedding_model}, ${s.top_k} chunks per question.`;
      })
      .catch((err) => { statsLine.textContent = `Something went wrong: ${err.message}`; });

    // One answer, newest first. textContent, never innerHTML, so the server's text can't add HTML.
    function showAnswer(question, data) {
      const block = document.createElement("section");
      const q = document.createElement("h3");
      q.textContent = question;
      const a = document.createElement("p");
      a.style.whiteSpace = "pre-wrap";          // keep the answer's line breaks
      a.textContent = data.answer;
      const list = document.createElement("ul");
      for (const source of data.sources) {
        const item = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = source.title;
        item.append(title, ` (${source.system}, ${source.category}): ${source.snippet}`);
        list.append(item);
      }
      block.append(q, a, "Found by the search:", list, document.createElement("hr"));
      answers.prepend(block);
    }

    // Each submit: send the question, then show the answer or what went wrong.
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();                   // stay on this page: the form would otherwise reload it
      const question = document.getElementById("question").value;
      button.disabled = true;                   // one question at a time: each one is a real call to Gemini
      status.textContent = "Searching the knowledge base and asking Gemini…";
      try {
        const res = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        // 422 (bad question) and 502 (couldn't answer) have a JSON "detail" to show; others are unexpected.
        if (!res.ok && res.status !== 422 && res.status !== 502) {
          throw new Error(`the server answered HTTP ${res.status}`);
        }
        const data = await res.json();
        if (res.status === 422) {
          status.textContent = data.detail.map((p) => `${p.loc.at(-1)}: ${p.msg}`).join("; ");
        } else if (res.status === 502) {
          status.textContent = `${data.detail} The server's terminal says why.`;
        } else {
          showAnswer(question, data);
          status.textContent = "Done.";
        }
      } catch (err) {
        status.textContent = `Something went wrong: ${err.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
