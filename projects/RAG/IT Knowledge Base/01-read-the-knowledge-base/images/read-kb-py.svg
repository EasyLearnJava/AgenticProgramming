<!-- The picture for README.md's section "read_kb.py, from top to bottom". Plain SVG: edit the text in place. -->
<title id="title">read_kb.py, from top to bottom</title>
<desc id="desc">read_kb.py without its comments, in the order Python runs it, from top to bottom: the two import lines share the first box, then one statement or group per box. The imports take Path from Python's pathlib, and the package pandas, named pd. 1: KB_FILE = Path(__file__).resolve().parent / "data" / "sample_it_kb.csv" makes KB_FILE, the full path of data/sample_it_kb.csv in this script's folder; nothing is read yet. 2: kb = pd.read_csv(KB_FILE) reads the file: its first line gives the 8 column names, title, problem, resolution, system, category, notes, priority and tags, and each of its 10 article lines becomes a row, numbered 0 to 9. kb is a DataFrame of 10 rows and 8 columns. if __name__ == "__main__": checks how the file was started: run directly with python read_kb.py, the lines below it run; imported by the tests, they're skipped. 3: prints 10 articles and the column names. 4: prints the title, system and category of every row, with its row number, from 0 VPN Connection Timeout to 9 Microsoft Teams Audio Issues. 5: first = kb.iloc[0] picks the first row, and the for loop prints it one column per line, from title: VPN Connection Timeout to tags: vpn;timeout;remote;connection. Takeaway: making the path reads nothing; read_csv() is the line that reads the file into kb.</desc>
