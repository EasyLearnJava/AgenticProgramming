<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<!-- The picture for README.md's section "Run it". Plain SVG: edit the text in place. -->
<title id="title">Run it</title>
<desc id="desc">A terminal, as typed in Git Bash. $ cd "projects/RAG/IT Knowledge Base/01-read-the-knowledge-base": go into the step's folder. $ python -m venv .venv: once, make .venv/. $ source .venv/Scripts/activate: in each new terminal; the prompt now starts with (.venv). (.venv) $ pip install -r requirements-dev.txt: once; it prints Collecting pandas==3.0.6 (from -r ...requirements.txt (line 1)), more lines for each package, then Successfully installed colorama-0.4.6 iniconfig-2.3.1 numpy-2.5.4 and the rest, and [notice] A new release of pip is available: 25.1.1 -&gt; 26.2.1, information only. (.venv) $ python read_kb.py: each time; it prints 10 articles and columns: ['title', 'problem', 'resolution', 'system', 'category', 'notes', 'priority', 'tags'], then the title, system and category of rows 0 to 9 (0 VPN Connection Timeout, VPN, Remote Access; 1 MFA Setup Failure, MFA, Security; ... 9 Microsoft Teams Audio Issues, Microsoft Teams, Collaboration), then the first article, one column per line: title: VPN Connection Timeout, problem, resolution, system: VPN, category: Remote Access, notes, priority: High, tags: vpn;timeout;remote;connection. Then the prompt comes back. Long lines are cut in the picture. Takeaway: install once; then python read_kb.py reads the CSV and prints what's in it, each time.</desc>
