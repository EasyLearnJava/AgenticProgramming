[pytest]
# pythonpath = . puts this folder (the one pytest.ini is in) on the import path, so the tests can import main and
# src. testpaths = tests: a plain `python -m pytest` looks for tests only in tests/.
pythonpath = .
testpaths = tests
# Live tests call the real Gemini. tests/conftest.py skips them when there is no key.
# Run only the plain ones with:   python -m pytest -m "not live"
markers =
    live: calls the real Gemini API (needs GOOGLE_API_KEY, uses your quota)
