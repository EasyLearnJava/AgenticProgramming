<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project 2: LangChain basic (Python)</title>
</head>
<body>
  <h1>Project 2: LangChain basic (Python)</h1>
  <p id="answer">Asking the server…</p>
  <p id="details"></p>

  <script>
    // On page load: call the backend (main.py's GET /api/hello), which runs hello.py's chain, then show its answer.
    fetch("/api/hello")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((data) => {
        document.getElementById("answer").textContent = data.answer;
        document.getElementById("details").textContent =
          `Python ${data.python} · langchain-core ${data.langchain_core} · ${data.server_ms} ms on the server`;
      })
      .catch((err) => {
        document.getElementById("answer").textContent = `Could not reach the server: ${err.message}`;
      });
  </script>
</body>
</html>
