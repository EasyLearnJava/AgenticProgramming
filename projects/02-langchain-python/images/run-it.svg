<svg xmlns="http://www.w3.org/2000/svg" width="960" height="851" viewBox="0 0 960 851" role="img" aria-labelledby="title desc">
<!-- The picture for README.md's section "Run it". Plain SVG: edit the text in place. -->
<title id="title">Run it</title>
<desc id="desc">A terminal, as typed in Git Bash. $ cd projects/02-langchain-python: go into the project's folder. $ python -m venv .venv: once, make .venv/. $ source .venv/Scripts/activate: in each new terminal; the prompt now starts with (.venv). (.venv) $ pip install -r requirements-dev.txt: once; it prints Collecting fastapi==0.142.2 (from -r ...requirements.txt (line 1)), many more lines, then Successfully installed and the packages, and [notice] A new release of pip is available: 25.1.1 -&gt; 26.2.1, information only. (.venv) $ python hello.py prints Hello World, welcome to LangChain!: the chain alone. (.venv) $ uvicorn main:app --reload prints INFO: Will watch for changes in these directories: ['...02-langchain-python'], INFO: Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit), INFO: Started reloader process [46024] using StatReload, INFO: Started server process [18724], INFO: Waiting for application startup., INFO: Application startup complete.: main.py is imported, the chain is built, and the server waits. You open http://127.0.0.1:8000: INFO: 127.0.0.1:65317 - "GET / HTTP/1.1" 200 OK, the page; INFO: 127.0.0.1:65317 - "GET /api/hello HTTP/1.1" 200 OK, the page's fetch, which runs the chain; INFO: 127.0.0.1:65183 - "GET /favicon.ico HTTP/1.1" 404 Not Found, the tab icon, harmless. You press Ctrl+C: INFO: Shutting down, INFO: Waiting for application shutdown., INFO: Application shutdown complete., INFO: Finished server process [18724], INFO: Stopping reloader process [46024]: the server stops, and the prompt comes back. Takeaway: install once; then uvicorn runs the chain each time the page asks for it.</desc>
