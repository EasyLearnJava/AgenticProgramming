<text x="912" y="909.5" class="where" text-anchor="end" xml:space="preserve">main.py, in page()</text>
<text x="100" y="949" class="verb" xml:space="preserve">sends</text>
<text x="166" y="949" class="mix" xml:space="preserve"><tspan class="mono-in">index.html</tspan> to the browser, which asked for <tspan class="mono-in">GET /</tspan></text>
