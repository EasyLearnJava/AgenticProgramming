<text x="912" y="997.5" class="where" text-anchor="end" xml:space="preserve">index.html, as soon as it loads</text>
<text x="100" y="1037" class="verb" xml:space="preserve">asks</text>
<text x="166" y="1037" class="mix" xml:space="preserve"><tspan class="mono-in">GET /api/hello</tspan>: the page's script asks the server for the answer</text>
<rect x="84" y="1064" width="844" height="186" rx="10" class="cell-run"/>
<path d="M84,1118 L84,1074 A10,10 0 0 1 94,1064 L918,1064 A10,10 0 0 1 928,1074 L928,1118 Z" class="band-run"/>
