<text x="100" y="1086" class="code" xml:space="preserve">answer = await <tspan class="code-run">chain.ainvoke({})</tspan></text>
<text x="100" y="1106" class="code" xml:space="preserve">return {"answer": answer}</text>
<text x="912" y="1085.5" class="where" text-anchor="end" xml:space="preserve">main.py, in hello()</text>
