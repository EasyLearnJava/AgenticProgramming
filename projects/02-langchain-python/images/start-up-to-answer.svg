<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1494" viewBox="0 0 960 1494" role="img" aria-labelledby="title desc">
<!-- The picture for README.md's section "hello.py and main.py, from start-up to answer". Plain SVG: edit the text in place. -->
<title id="title">hello.py and main.py, from start-up to answer</title>
<desc id="desc">hello.py and main.py, from start-up to answer, without their comments. Once, at start-up, uvicorn main:app imports main.py: it takes Path, FastAPI and FileResponse, and from hello import chain runs hello.py from the top. hello.py takes PromptTemplate and RunnableLambda; 1 prompt = PromptTemplate.from_template("Hello World, welcome to LangChain!") makes prompt; 2 to_text = RunnableLambda(lambda value: value.to_string()) makes to_text; 3 chain = prompt | to_text makes chain; none of them runs yet. 4 if __name__ == "__main__": is skipped, because hello.py was imported, not run. Back in main.py, 5 app = FastAPI(title="AgenticProgramming project 2") makes app; 6 PAGE and async def page() make page() for GET / and /index.html; 7 async def hello() makes hello() for GET /api/hello. Their bodies don't run yet. uvicorn prints Application startup complete. and waits. Each time you open the page: the browser asks for GET /, and 6 page() runs return FileResponse(PAGE, headers={"Cache-Control": "no-cache"}), which sends index.html. 8 The page's fetch("/api/hello") asks for GET /api/hello. 7 hello() runs answer = await chain.ainvoke({}): the input {} goes into prompt, which gives a StringPromptValue to to_text, which gives back the string; await waits for the chain to finish, and return {"answer": answer} sends {"answer":"Hello World, welcome to LangChain!"}. 9 The page's document.getElementById("answer").textContent = data.answer; shows Hello World, welcome to LangChain! Takeaway: start-up makes the chain once; each GET /api/hello runs it.</desc>
