<rect x="0.75" y="0.75" width="958.5" height="1492.5" rx="14" class="card"/>
<text x="32" y="59" class="title" xml:space="preserve">hello.py and main.py, from start-up to answer</text>
<text x="32" y="92" class="sub" xml:space="preserve">uvicorn imports main.py once, when the server starts. After that, each request runs one function.</text>
<text x="84" y="130" class="lane" xml:space="preserve">ONCE, AT START-UP: MAIN.PY AND HELLO.PY, WITHOUT THEIR COMMENTS</text>
<rect x="84" y="144" width="844" height="644" rx="10" class="cell"/>
<path d="M84,178 L84,154 A10,10 0 0 1 94,144 L918,144 A10,10 0 0 1 928,154 L928,178 Z" class="band"/>
<line x1="84" y1="178" x2="928" y2="178" class="rule"/>
<text x="100" y="199" class="lcode" xml:space="preserve">from pathlib import Path</text>
<text x="914" y="198.5" class="note" text-anchor="end" xml:space="preserve">takes Path</text>
<text x="100" y="221" class="lcode" xml:space="preserve">from fastapi import FastAPI</text>
<text x="914" y="220.5" class="note" text-anchor="end" xml:space="preserve">takes FastAPI</text>
<text x="100" y="243" class="lcode" xml:space="preserve">from fastapi.responses import FileResponse</text>
<text x="914" y="242.5" class="note" text-anchor="end" xml:space="preserve">takes FileResponse</text>
<text x="100" y="265" class="lcode" xml:space="preserve">from hello import chain</text>
<text x="914" y="264.5" class="note" text-anchor="end" xml:space="preserve">runs hello.py, from the top:</text>
<rect x="116" y="276" width="796" height="248" rx="10" class="cell"/>
<path d="M116,310 L116,286 A10,10 0 0 1 126,276 L902,276 A10,10 0 0 1 912,286 L912,310 Z" class="band"/>
<line x1="116" y1="310" x2="912" y2="310" class="rule"/>
<text x="132" y="331" class="lcode" xml:space="preserve">from langchain_core.prompts import PromptTemplate</text>
<text x="898" y="330.5" class="note" text-anchor="end" xml:space="preserve">takes PromptTemplate</text>
<text x="132" y="353" class="lcode" xml:space="preserve">from langchain_core.runnables import RunnableLambda</text>
<text x="898" y="352.5" class="note" text-anchor="end" xml:space="preserve">takes RunnableLambda</text>
<text x="132" y="379" class="lcode" xml:space="preserve">prompt = PromptTemplate.from_template("Hello World, welcome to LangChain!")</text>
<rect x="825.78" y="364" width="72.22" height="22" rx="6" class="box-idle"/>
<text x="861.89" y="379.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">prompt</text>
<text x="132" y="409" class="lcode" xml:space="preserve">to_text = RunnableLambda(lambda value: value.to_string())</text>
<rect x="817.41" y="394" width="80.59" height="22" rx="6" class="box-idle"/>
<text x="857.705" y="409.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">to_text</text>
<text x="132" y="439" class="lcode" xml:space="preserve">chain = prompt | to_text</text>
<rect x="834.15" y="424" width="63.85" height="22" rx="6" class="box-idle"/>
<text x="866.075" y="439.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">chain</text>
<text x="132" y="465" class="lcode" xml:space="preserve">if __name__ == "__main__":</text>
<text x="898" y="464.5" class="note" text-anchor="end" xml:space="preserve">skipped: hello.py was imported, not run</text>
<text x="132" y="487" class="lcode dim" xml:space="preserve">    answer = chain.invoke({})</text>
<text x="132" y="509" class="lcode dim" xml:space="preserve">    print(answer)</text>
<text x="132" y="298.5" class="fname" xml:space="preserve">hello.py</text>
<text x="896" y="298" class="note" text-anchor="end" xml:space="preserve">makes the chain, but runs none of it</text>
<rect x="116" y="276" width="796" height="248" rx="10" class="edge"/>
<text x="100" y="549" class="lcode" xml:space="preserve">app = FastAPI(title="AgenticProgramming project 2")</text>
<rect x="866.89" y="534" width="47.11" height="22" rx="6" class="box-idle"/>
<text x="890.445" y="549.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">app</text>
<text x="100" y="575" class="lcode" xml:space="preserve">PAGE = Path(__file__).resolve().parent / "index.html"</text>
<text x="914" y="574.5" class="note" text-anchor="end" xml:space="preserve">the page's file</text>
<text x="100" y="597" class="lcode" xml:space="preserve">@app.get("/")</text>
<text x="100" y="619" class="lcode" xml:space="preserve">@app.get("/index.html")</text>
<text x="100" y="645" class="lcode" xml:space="preserve">async def page():</text>
<rect x="841.78" y="630" width="72.22" height="22" rx="6" class="box-idle"/>
<text x="877.89" y="645.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">page()</text>
<text x="829.78" y="644.5" class="note" text-anchor="end" xml:space="preserve">for GET / and /index.html</text>
<text x="100" y="671" class="lcode dim" xml:space="preserve">    return FileResponse(PAGE, headers={"Cache-Control": "no-cache"})</text>
<text x="914" y="670.5" class="note" text-anchor="end" xml:space="preserve">runs later, on each GET /</text>
<text x="100" y="697" class="lcode" xml:space="preserve">@app.get("/api/hello")</text>
<text x="100" y="723" class="lcode" xml:space="preserve">async def hello():</text>
<rect x="833.41" y="708" width="80.59" height="22" rx="6" class="box-idle"/>
<text x="873.705" y="723.5" class="code name" style="font-size:13px" text-anchor="middle" xml:space="preserve">hello()</text>
<text x="821.41" y="722.5" class="note" text-anchor="end" xml:space="preserve">for GET /api/hello</text>
<text x="100" y="749" class="lcode dim" xml:space="preserve">    answer = await chain.ainvoke({})</text>
<text x="100" y="771" class="lcode dim" xml:space="preserve">    return {"answer": answer}</text>
<path d="M906,736 L914,736 L914,776 L906,776" class="bracket"/>
<text x="898" y="760.5" class="note" text-anchor="end" xml:space="preserve">runs later, on each GET /api/hello</text>
<text x="100" y="166.5" class="fname" xml:space="preserve">main.py</text>
<text x="912" y="166" class="note" text-anchor="end" xml:space="preserve">uvicorn main:app imports it, once</text>
<rect x="84" y="144" width="844" height="644" rx="10" class="edge"/>
<rect x="84" y="802" width="334.25" height="32" rx="8" class="box-term"/>
<text x="100" y="823" class="term" style="font-size:12.5px" xml:space="preserve"><tspan class="term-info">INFO</tspan><tspan class="term-cmd">:     Application startup complete.</tspan></text>
<text x="434.25" y="823" class="note" xml:space="preserve">Now the server waits. No step of the chain has run yet.</text>
<text x="84" y="874" class="lane" xml:space="preserve">EACH TIME YOU OPEN THE PAGE</text>
<rect x="84" y="888" width="844" height="78" rx="10" class="cell"/>
<path d="M84,922 L84,898 A10,10 0 0 1 94,888 L918,888 A10,10 0 0 1 928,898 L928,922 Z" class="band"/>
